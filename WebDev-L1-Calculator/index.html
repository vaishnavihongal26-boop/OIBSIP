<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

 <div class="calculator">
    <button class="theme-toggle" id="themeToggle">🌙</button>
    <button class="mode-toggle" id="modeToggle">Sci</button>
    
    <button class="convert-toggle" id="convertToggle">⇄</button>
       <div class="display">
      <div class="prev" id="prevOperand"></div>
      <div class="current-row">
        <div class="current" id="currentOperand">0</div>
        <button class="copy-btn" id="copyBtn" title="Copy result">⧉</button>
      </div>
    </div>
    <div class="grid">
      <button class="clear" data-action="clear">C</button>
      <button data-action="backspace">⌫</button>
      <button class="op" data-action="operator" data-operator="÷">÷</button>
      <button class="op" data-action="operator" data-operator="×">×</button>

      <button data-number="7">7</button>
      <button data-number="8">8</button>
      <button data-number="9">9</button>
      <button class="op" data-action="operator" data-operator="−">−</button>

      <button data-number="4">4</button>
      <button data-number="5">5</button>
      <button data-number="6">6</button>
      <button class="op" data-action="operator" data-operator="+">+</button>

      <button data-number="1">1</button>
      <button data-number="2">2</button>
      <button data-number="3">3</button>
      <button class="eq" data-action="equals">=</button>

      <button data-number="0">0</button>
      <button data-number=".">.</button>
        </div>

    <div class="sci-grid" id="sciGrid">
      <button data-sci="sqrt">√</button>
      <button data-sci="square">x²</button>
      <button data-sci="percent">%</button>
      <button data-sci="pi">π</button>
      <button data-sci="sin">sin</button>
      <button data-sci="cos">cos</button>
      <button data-sci="tan">tan</button>
      <button data-sci="log">log</button>
    </div>
        <div class="converter" id="converterPanel">
      <select id="converterType">
        <option value="length">Length</option>
        <option value="weight">Weight</option>
        <option value="temperature">Temperature</option>
      </select>

      <div class="converter-row">
        <input type="number" id="convertFromValue" placeholder="Enter value">
        <select id="convertFromUnit"></select>
      </div>

      <div class="converter-arrow">↓</div>

      <div class="converter-row">
        <input type="number" id="convertToValue" placeholder="Result" readonly>
        <select id="convertToUnit"></select>
      </div>
    </div>

    <div class="history">
      <div class="history-header">
        <span>History</span>
        <button class="clear-history" id="downloadHistory">Download</button>
        <button class="clear-history" id="clearHistory">Clear</button>
      </div>
      <ul id="historyList"></ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
